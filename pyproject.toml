[project]
name = "rl-transaction-attack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "deprecated>=1.2.18",
    "imblearn>=0.0",
    "jupyterlab>=4.4.2",
    "matplotlib>=3.9.2",
    "multi-agent-rlenv>=3.3.7",
    "optuna-dashboard>=0.18.0",
    "optuna>=4.3.0",
    "orjson>=3.10.18",
    "pandas>=2.2.3",
    "polars>=1.14.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scikit-learn<1.8",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "torch<2.8",
    "tqdm>=4.67.1",
    "gunicorn>=23.0.0",
    "ipywidgets>=8.1.7",
    "pyarrow>=20.0.0",
    "pyinstrument>=5.1.1",
    "tensorboard>=2.20.0",
    "humanize>=4.14.0",
    "typed-argument-parser>=1.11.0",
    "scikit-posthocs>=0.11.4",
    "critdd",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140

[dependency-groups]
dev = ["pytest>=9.0.2"]


[tool.basedpyright]
include = ["src"]

[tool.uv.sources]
critdd = { git = "https://github.com/mirkobunse/critdd" }
